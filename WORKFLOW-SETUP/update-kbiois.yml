name: Update KBIOIS Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 1 * *" # 매월 2일 06:15 KST

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch selected KBIOIS indicators
        env:
          KBIOIS_API_KEY: ${{ secrets.KBIOIS_API_KEY }}
        run: python scripts/update_kbiois.py
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kbiois-pilot.json
          git diff --cached --quiet || git commit -m "chore: update KBIOIS pilot data"
          git push
