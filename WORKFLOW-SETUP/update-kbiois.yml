name: Update KBIOIS Statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * 1'
permissions:
  contents: write
jobs:
  update-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Update KBIOIS cache
        env:
          KBIOIS_API_KEY: ${{ secrets.KBIOIS_API_KEY }}
        run: python scripts/update_kbiois.py
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kbiois-pilot.json
          git diff --cached --quiet || git commit -m "chore: update KBIOIS statistics"
          git push
